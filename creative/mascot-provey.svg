<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800">
<rect width="800" height="800" fill="#0d1117"/>
<rect x="60" y="60" width="680" height="680" fill="#f5efe0" stroke="#0d1117" stroke-width="8"/>
<!-- robot head -->
<rect x="250" y="220" width="300" height="240" rx="30" fill="#2b3137" stroke="#0d1117" stroke-width="6"/>
<rect x="290" y="270" width="90" height="80" rx="12" fill="#58e6d9"/>
<rect x="420" y="270" width="90" height="80" rx="12" fill="#58e6d9"/>
<rect x="310" y="295" width="50" height="30" rx="6" fill="#0d1117"/>
<rect x="440" y="295" width="50" height="30" rx="6" fill="#0d1117"/>
<rect x="320" y="390" width="160" height="20" rx="10" fill="#58e6d9"/>
<rect x="390" y="150" width="20" height="70" fill="#2b3137"/>
